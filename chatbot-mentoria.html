<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chatbot MIA — Widget v3</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Karla:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
#mia-chat-widget * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Karla', sans-serif; }

#mia-chat-btn {
  position: fixed; bottom: 28px; right: 28px;
  width: 62px; height: 62px; border-radius: 50%;
  background: linear-gradient(135deg, #1c1714, #3a2e28);
  border: 2px solid #b8882a;
  box-shadow: 0 8px 32px rgba(28,23,20,.35), 0 0 0 0 rgba(184,136,42,.4);
  cursor: pointer; z-index: 99999;
  display: flex; align-items: center; justify-content: center;
  transition: all .3s ease; animation: mia-pulse 3s infinite;
}
#mia-chat-btn:hover { transform: scale(1.08); }
#mia-chat-btn svg { width: 26px; height: 26px; }
#mia-chat-btn .mia-close-icon { display: none; }
#mia-chat-btn.open .mia-chat-icon { display: none; }
#mia-chat-btn.open .mia-close-icon { display: block; }

@keyframes mia-pulse {
  0%,100% { box-shadow: 0 8px 32px rgba(28,23,20,.35), 0 0 0 0 rgba(184,136,42,.4); }
  50% { box-shadow: 0 8px 32px rgba(28,23,20,.35), 0 0 0 10px rgba(184,136,42,0); }
}

#mia-badge {
  position: fixed; bottom: 82px; right: 24px;
  background: #c0553a; color: #fff;
  font-size: .72rem; font-weight: 700;
  padding: 4px 10px; border-radius: 20px;
  z-index: 99998; white-space: nowrap;
  animation: mia-fadein .5s ease 2s both;
  font-family: 'Karla', sans-serif;
}
@keyframes mia-fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

#mia-chat-window {
  position: fixed; bottom: 104px; right: 28px;
  width: 380px; max-width: calc(100vw - 40px);
  height: 600px; max-height: calc(100vh - 140px);
  background: #faf6f1;
  border: 1.5px solid #e2d5c8; border-radius: 20px;
  box-shadow: 0 24px 80px rgba(28,23,20,.2), 0 4px 20px rgba(28,23,20,.1);
  z-index: 99998; display: none; flex-direction: column; overflow: hidden;
  transform: scale(.95) translateY(10px); opacity: 0;
  transition: all .25s cubic-bezier(.34,1.56,.64,1);
}
body { background: transparent !important; margin: 0; padding: 0; }
#mia-chat-btn, #mia-chat-window { pointer-events: auto; }
#mia-chat-window.open { display: flex; transform: scale(1) translateY(0); opacity: 1; }

#mia-header {
  background: linear-gradient(135deg, #1c1714 0%, #2d2420 100%);
  padding: 16px 20px 12px; border-bottom: 1px solid rgba(184,136,42,.3); flex-shrink: 0;
}
.mia-header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.mia-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: linear-gradient(135deg, #b8882a, #d4a030);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Libre Baskerville', serif; font-size: .9rem; font-weight: 700;
  color: #1c1714; flex-shrink: 0;
}
.mia-header-info { flex: 1; }
.mia-header-name { font-family: 'Libre Baskerville', serif; font-size: .95rem; font-weight: 700; color: #faf6f1; line-height: 1.2; }
.mia-header-name em { color: #d4a030; font-style: italic; }
.mia-header-status { font-family: 'Fira Code', monospace; font-size: .65rem; color: rgba(250,246,241,1); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.mia-dot { width: 6px; height: 6px; border-radius: 50%; background: #4a7c59; animation: mia-blink 2s infinite; }
@keyframes mia-blink { 0%,100%{opacity:1} 50%{opacity:.3} }

.mia-programs { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
.mia-pill {
  font-family: 'Fira Code', monospace; font-size: .58rem;
  padding: 2px 8px; border-radius: 10px;
  border: 1px solid rgba(184,136,42,.4); color: rgba(212,160,48,.9);
  background: rgba(184,136,42,.1); letter-spacing: .04em; white-space: nowrap;
}
.mia-pill.mite {
  border-color: rgba(91,163,255,.4); color: rgba(91,163,255,.9);
  background: rgba(56,132,255,.1);
}

#mia-messages { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
#mia-messages::-webkit-scrollbar { width: 4px; }
#mia-messages::-webkit-scrollbar-track { background: transparent; }
#mia-messages::-webkit-scrollbar-thumb { background: #e2d5c8; border-radius: 2px; }

.mia-msg { display: flex; gap: 8px; align-items: flex-end; animation: mia-msgin .2s ease; }
@keyframes mia-msgin { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.mia-msg.user { flex-direction: row-reverse; }

.mia-msg-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, #b8882a, #d4a030);
  display: flex; align-items: center; justify-content: center;
  font-size: .65rem; font-weight: 700; color: #1c1714; flex-shrink: 0;
  font-family: 'Libre Baskerville', serif;
}
.mia-msg.user .mia-msg-avatar { background: linear-gradient(135deg, #4a7c59, #5a9c6a); color: #fff; }

.mia-bubble { max-width: 78%; padding: 12px 15px; border-radius: 14px; font-size: .88rem; line-height: 1.55; color: #1c1714; }
.mia-msg.bot .mia-bubble { background: #fff; border: 1px solid #e2d5c8; border-bottom-left-radius: 4px; }
.mia-msg.user .mia-bubble { background: linear-gradient(135deg, #1c1714, #2d2420); color: #faf6f1; border-bottom-right-radius: 4px; }

.mia-typing .mia-bubble { padding: 14px 18px; }
.mia-typing-dots { display: flex; gap: 4px; align-items: center; }
.mia-typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: #b8882a; animation: mia-bounce .8s infinite; }
.mia-typing-dots span:nth-child(2) { animation-delay: .15s; }
.mia-typing-dots span:nth-child(3) { animation-delay: .3s; }
@keyframes mia-bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }

#mia-suggestions { padding: 0 16px 8px; display: flex; gap: 5px; flex-wrap: wrap; flex-shrink: 0; }
.mia-suggestion {
  background: #fff; border: 1px solid #e2d5c8; border-radius: 20px;
  padding: 4px 11px; font-size: .73rem; color: #3a2e28; cursor: pointer;
  transition: all .2s; white-space: nowrap; font-family: 'Karla', sans-serif;
}
.mia-suggestion:hover { border-color: #b8882a; color: #b8882a; background: rgba(184,136,42,.05); }

#mia-sug-tabs { padding: 0 16px 4px; display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; }
.mia-sug-tab {
  font-size: .67rem; padding: 3px 10px; border-radius: 10px;
  cursor: pointer; border: 1px solid #e2d5c8; background: #fff;
  color: #888; font-family: 'Fira Code', monospace; transition: all .2s;
}
.mia-sug-tab.active { background: #1c1714; color: #d4a030; border-color: #1c1714; }
.mia-sug-tab.mite-tab.active { background: #0d1b2e; color: #5ba3ff; border-color: #1a3a6a; }

#mia-input-area {
  padding: 10px 16px 14px; border-top: 1px solid #e2d5c8;
  display: flex; gap: 8px; align-items: flex-end;
  background: #fff; flex-shrink: 0;
}
#mia-input {
  flex: 1; border: 1.5px solid #e2d5c8; border-radius: 12px;
  padding: 10px 14px; font-family: 'Karla', sans-serif; font-size: .88rem;
  color: #1c1714; background: #faf6f1; outline: none; resize: none;
  max-height: 100px; transition: border-color .2s; line-height: 1.4;
}
#mia-input:focus { border-color: #b8882a; }
#mia-input::placeholder { color: #bbb; }
#mia-send {
  width: 40px; height: 40px; border-radius: 10px;
  background: linear-gradient(135deg, #1c1714, #3a2e28);
  border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .2s; flex-shrink: 0;
}
#mia-send:hover { background: #c0553a; transform: scale(1.05); }
#mia-send:disabled { opacity: .4; cursor: not-allowed; transform: none; }
#mia-send svg { width: 16px; height: 16px; }
</style>
</head>
<body style="background:transparent;margin:0;padding:0;">

<div id="mia-chat-widget">
  <div id="mia-badge">💬 Tire suas dúvidas!</div>

  <button id="mia-chat-btn" onclick="miaToggle()" aria-label="Abrir chat">
    <svg class="mia-chat-icon" viewBox="0 0 24 24" fill="none" stroke="#d4a030" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <svg class="mia-close-icon" viewBox="0 0 24 24" fill="none" stroke="#d4a030" stroke-width="2.5" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>

  <div id="mia-chat-window">
    <div id="mia-header">
      <div class="mia-header-top">
        <div class="mia-avatar">MIA</div>
        <div class="mia-header-info">
          <div class="mia-header-name">Assistente <em>Luiz de Castro</em></div>
          <div class="mia-header-status">
            <div class="mia-dot"></div>
            Online · Responde em segundos
          </div>
        </div>
      </div>
      <div class="mia-programs">
        <span class="mia-pill">🤖 Profissões + IA</span>
        <span class="mia-pill">🚀 Startups</span>
        <span class="mia-pill">💡 Inovação</span>
        <span class="mia-pill mite">🎓 MITE</span>
      </div>
    </div>

    <div id="mia-messages"></div>

    <div id="mia-sug-tabs">
      <button class="mia-sug-tab active" onclick="miaSwitchTab(this,'ia')">🤖 IA</button>
      <button class="mia-sug-tab" onclick="miaSwitchTab(this,'startups')">🚀 Startups</button>
      <button class="mia-sug-tab" onclick="miaSwitchTab(this,'inovacao')">💡 Inovação</button>
      <button class="mia-sug-tab mite-tab" onclick="miaSwitchTab(this,'mite')">🎓 MITE</button>
    </div>

    <div id="mia-suggestions"></div>

    <div id="mia-input-area">
      <textarea id="mia-input" placeholder="Digite sua dúvida..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();miaSend();}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
      <button id="mia-send" onclick="miaSend()" title="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="#d4a030" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
const MIA_PROXY = 'https://proxy-educacao.intelectus247.workers.dev';

const MIA_SYSTEM = `Você é MIA, a assistente virtual dos programas de mentoria de Luiz Carlos de Castro — Mestre em Gestão e Administrador de Empresas.

Você atende quatro programas interligados:

PROFISSÕES EM ALTA com IA:
- AI Engineer | AI Trainer / Prompt Engineer | LLM Consultant | Analista de Dados com IA
- AI Product Manager | Especialista em Automação (n8n, Make, Zapier) | Criador de Conteúdo com IA | Consultor de Implementação de IA

FERRAMENTAS DE IA POR CATEGORIA:
- Texto/Chat: ChatGPT, Claude, Gemini, Perplexity
- Imagem: Midjourney, DALL-E, Stable Diffusion, Adobe Firefly
- Vídeo: Runway ML, HeyGen, Sora | Áudio: ElevenLabs, Whisper, Descript
- Código: Cursor, GitHub Copilot, Replit, v0 | Automação: Make, n8n, Zapier
- Apresentações: Gamma, Beautiful.ai | Produtividade: Notion AI, Otter.ai, Motion

TENDÊNCIAS: O futuro é "humanos com IA vs humanos sem IA". Profissionais com IA entregam 2-5x mais em menos tempo.

═══════════════════════════════════════════════════════
PROGRAMA 2 — MENTORIA DAS STARTUPS
"Do Zero ao Sucesso Empreendedor" | 8 módulos
═══════════════════════════════════════════════════════
Módulo 0 — Ideação & Validação: MVP, Design Thinking, Lean Startup, pivotar ou perseverar
Módulo 1 — Modelagem de Negócio: Business Model Canvas, Value Proposition Canvas, modelos de receita (SaaS, marketplace, freemium)
Módulo 2 — Registro Legal: MEI/LTDA/S.A., Simples Nacional, INPI, LGPD
Módulo 3 — Gestão Financeira: DRE, CAC, LTV (LTV/CAC > 3), Churn (<2%/mês), MRR, ARR, Burn Rate
Módulo 4 — Marketing & Vendas: PMF, Growth Hacking, funil AARRR, PLG (Slack/Notion/Figma)
Módulo 5 — Captação: Angels (R$50k-500k), VCs, Aceleradoras, Pitch Deck de 10 slides (Sequoia), valuation, cap table
Módulo 6 — Operações & Escala: OKRs, Scrum, Kanban, RICE Score, LGPD compliance

Temas: inovação incremental/disruptiva/radical, Design Thinking, Innovation Accounting, cultura de inovação, Open Innovation, frameworks (Stage-Gate, Blue Ocean), portfólio 70-20-10, inovação com IA. Detalhes completos em breve em lojasdecastro.com.br.

Sistema de mentoria online automatizado | 120 dias de acesso
═══════════════════════════════════════════════════════
INVESTIMENTO: R$ 797,00 (pagamento único via InfinitePay — Pix, cartão ou boleto)
ACESSO: 120 dias a partir da data de inscrição
CERTIFICADO: Digital, automático, emitido ao atingir nota mínima 7,0

OS 5 MÓDULOS TEMÁTICOS:
1. Fundamentos da Inovação
2. Tecnologias Digitais na Sala de Aula
3. Gamificação na Educação
4. Inteligência Artificial na Educação
5. Gestão e Avaliação da Inovação

AVALIAÇÃO: 30 questões objetivas, nota mínima 7,0, até 3 tentativas.
CERTIFICADO: "Gestão da Inovação em Tecnologias da Educação", emissão automática.

═══════════════════════════════════════════════════════
PERSONALIDADE E ESTILO DE RESPOSTA
═══════════════════════════════════════════════════════
- Tom: acolhedor, profissional, motivador e direto
- Sempre em português do Brasil
- Máximo de 4 parágrafos por resposta
- Use exemplos reais e concretos sempre que possível
- Para inscrição no MITE: informe que o acesso é via lojasdecastro.com.br, valor R$ 797,00
- Quando não souber algo específico, sugira contato pelo site lojasdecastro.com.br
- Nunca diga que profissões vão "acabar" — diga que vão se transformar
- Sempre termine respostas sobre carreira/negócio/educação com uma ação prática`;

const MIA_SUGGESTIONS = {
  ia: ['Minha profissão vai mudar com IA?','Quais profissões estão em alta?','Como usar IA no meu trabalho?','Quais ferramentas de IA usar?','Como cobrar mais com IA?','O que é o curso de Profissões + IA?'],
  startups: ['Como validar minha ideia de startup?','O que é MVP e como criar um?','Como montar meu pitch para investidores?','O que é CAC, LTV e Churn?','Como abrir minha startup no Brasil?','Quando buscar investimento?'],
  inovacao: ['O que é inovação disruptiva?','Como criar cultura de inovação?','O que é Design Thinking?','Como usar IA para inovar?','O que é Open Innovation?','Quando começa a Mentoria de Inovação?'],
  mite: ['O que é o MITE?','Qual o valor do curso MITE?','Como funciona a certificação MITE?','Quais os módulos do MITE?','O que é gamificação na educação?','Como a IA está transformando a educação?','O que é sala de aula invertida?','Quais ferramentas digitais uso em sala?'],
};

let miaHistory = [];
let miaOpen = false;
let miaLoading = false;
let miaCurrentTab = 'ia';

function miaSwitchTab(el, tab) {
  document.querySelectorAll('.mia-sug-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  miaCurrentTab = tab;
  miaRenderSuggestions();
}

function miaRenderSuggestions() {
  const container = document.getElementById('mia-suggestions');
  container.innerHTML = MIA_SUGGESTIONS[miaCurrentTab]
    .map(s => `<button class="mia-suggestion" onclick="miaSuggest(this)">${s}</button>`)
    .join('');
}

function miaToggle(){
  miaOpen = !miaOpen;
  const btn = document.getElementById('mia-chat-btn');
  const win = document.getElementById('mia-chat-window');
  document.getElementById('mia-badge').style.display = 'none';
  btn.classList.toggle('open', miaOpen);
  if(miaOpen){
    win.style.display = 'flex';
    setTimeout(()=> win.classList.add('open'), 10);
    if(miaHistory.length === 0) miaWelcome();
    try { window.parent.postMessage('mia-open', '*'); } catch(e){}
  } else {
    win.classList.remove('open');
    setTimeout(()=> win.style.display = 'none', 250);
    try { window.parent.postMessage('mia-close', '*'); } catch(e){}
  }
}

function miaWelcome(){
  miaAddMsg('bot', 'Olá! 👋 Sou a <strong>MIA</strong>, assistente dos programas de mentoria de Luiz de Castro.<br><br>Posso ajudar com dúvidas sobre <strong>IA e o futuro das profissões</strong>, <strong>startups</strong>, <strong>inovação estratégica</strong> ou sobre o programa <strong>MITE</strong>. Por onde quer começar?');
}

function miaAddMsg(role, html, isTyping = false){
  const msgs = document.getElementById('mia-messages');
  const div = document.createElement('div');
  div.className = `mia-msg ${role}${isTyping ? ' mia-typing' : ''}`;
  div.innerHTML = `
    <div class="mia-msg-avatar">${role === 'bot' ? 'MIA' : 'EU'}</div>
    <div class="mia-bubble">${isTyping ? '<div class="mia-typing-dots"><span></span><span></span><span></span></div>' : html}</div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function miaSuggest(btn){
  document.getElementById('mia-input').value = btn.textContent;
  miaSend();
}

async function miaSend(){
  const input = document.getElementById('mia-input');
  const text = input.value.trim();
  if(!text || miaLoading) return;

  input.value = '';
  input.style.height = 'auto';
  miaAddMsg('user', text);
  miaHistory.push({ role: 'user', content: text });

  miaLoading = true;
  document.getElementById('mia-send').disabled = true;
  const typingEl = miaAddMsg('bot', '', true);

  try {
    const res = await fetch(MIA_PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 700,
        system: MIA_SYSTEM,
        messages: miaHistory
      })
    });

    const data = await res.json();

    if(data.error){
      typingEl.remove();
      miaAddMsg('bot', '⚠ Erro: ' + (data.error.message || 'Tente novamente.'));
    } else {
      const reply = data.content?.[0]?.text || 'Não consegui gerar uma resposta.';
      miaHistory.push({ role: 'assistant', content: reply });
      typingEl.remove();
      miaAddMsg('bot', reply.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>'));
    }
  } catch(e) {
    typingEl.remove();
    miaAddMsg('bot', '⚠ Erro de conexão. Verifique sua internet e tente novamente.');
    console.error('MIA erro:', e);
  }

  miaLoading = false;
  document.getElementById('mia-send').disabled = false;
  document.getElementById('mia-input').focus();
}

document.addEventListener('DOMContentLoaded', () => {
  miaRenderSuggestions();
  setTimeout(() => {
    const b = document.getElementById('mia-badge');
    if(b) b.style.display = 'none';
  }, 8000);
});
</script>
</body>
</html>
